{{ define "main" }}
<main class="max-w-4xl mx-auto px-5 py-10">
  <article>

    <header class="mb-6">
      <h1 class="text-2xl font-bold leading-snug mb-1" style="color:var(--color-text);">
        {{ .Title }}
      </h1>
      {{ with .Params.subtitle }}
        <p class="text-base mt-1" style="color:var(--color-secondary);">{{ . }}</p>
      {{ end }}
      {{ if .Date }}
        {{ partial "post-meta.html" . }}
      {{ end }}
    </header>

    <div class="prose max-w-none
      prose-headings:font-semibold
      prose-h1:text-xl prose-h2:text-lg prose-h3:text-base
      prose-img:rounded prose-img:border prose-img:border-[var(--color-border)]
      prose-pre:p-0 prose-pre:bg-transparent prose-pre:border-0">
      {{ .Content }}
    </div>

  </article>
</main>
{{ end }}
