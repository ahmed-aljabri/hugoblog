<footer class="mt-16 border-t border-[var(--color-border)]">
  <div class="max-w-4xl mx-auto px-5 py-8 text-[var(--color-secondary)] text-sm">

    {{ if .Site.Params.social }}
      <div class="flex flex-wrap gap-x-4 gap-y-1 mb-4">
        {{ range .Site.Params.social }}
          <a href="{{ .url }}" class="no-underline hover:text-[var(--color-link)] transition-colors">
            {{ .name }}
          </a>
        {{ end }}
      </div>
    {{ end }}

    <div class="flex flex-wrap justify-between gap-2 text-xs text-[var(--color-muted)]">
      <span>
        &copy; 2023&ndash;{{ now.Format "2006" }}
        <a href="{{ .Site.BaseURL }}" class="no-underline hover:text-[var(--color-link)]">
          {{ .Site.Params.Author | default .Site.Title }}
        </a>.
        {{ with .Site.Params.copyright }}{{ . | safeHTML }}{{ end }}
      </span>
      <span>
        Built with <a href="https://gohugo.io" class="no-underline hover:text-[var(--color-link)]">Hugo</a>
        &middot; Design inspired by <a href="https://anil.recoil.org" class="no-underline hover:text-[var(--color-link)]">anil.recoil.org</a>
      </span>
    </div>

  </div>
</footer>
