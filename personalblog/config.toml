baseURL = 'http://ahmed-aljabri.github.io/'
languageCode = 'en-us'
title = 'Ahmed Al-Jabri'
theme="martian"
pagerSize     = 10


[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Site Logo
  brandIconFile = "img/avatar.jpg"   # relative to /static

  # Custom styles appended after theme CSS
  customStylesheets = ["css/custom.css"]


  # Subtitle for home
  subtitle = "Technical blog & portfolio site"

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Enable sharing buttons, if you like
  enableSharingButtons = true

  #Set ThemeTogel > dictates setting based on client OS's preference + allows user to decide
  enableThemeToggle = true

  # Metadata mostly used in document's head
  locations   = ["Cambridge, UK", "Muscat, Oman"]
  description = "portfolio site and personal blog"
  keywords = "homepage, blog, papers"
  images = [""]

[taxonomies]
    category = "categories"
    tag      = "tags"


  # Social Icons - Links to personal accounts

  [[params.social]]
     name = "github"
     url = "https://github.com/ahmed-aljabri"

  # ── Sidebar card ─────────────────────────────────────────────
  [params.sidebar]
    email = "contact@ahmedaljabri.blog"

  [[params.sidebar.sections]]
    title = "Currently"
    [[params.sidebar.sections.items]]
      label = "MPhil ACS — in progress"
      url   = ""
    [[params.sidebar.sections.items]]
      label = "University of Cambridge"
      url   = ""

  [[params.sidebar.sections]]
    title = "Contact"
    [[params.sidebar.sections.items]]
      label = "contact@ahmedaljabri.blog"
      url   = "mailto:contact@ahmedaljabri.blog"

  [[params.sidebar.sections]]
    title = "Social"
    [[params.sidebar.sections.items]]
      label = "GitHub"
      url   = "https://github.com/ahmed-aljabri"
    [[params.sidebar.sections.items]]
      label = "LinkedIn"
      url   = "https://www.linkedin.com/in/aljabri-ahmed/"

  [[params.sidebar.sections]]
    title = "Writing"
    [[params.sidebar.sections.items]]
      label = "Blog posts"
      url   = "/posts/"
    [[params.sidebar.sections.items]]
      label = "Notes"
      url   = "/notes/"

[languages]
  [languages.en]
    title = "Ahmed Al-Jabri"
    subtitle = "Portfolio Site and Technical Blog"
    keywords = "blog"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    readOtherPosts = "Read other posts"

    [languages.en.params.logo]
      logoText = "/Home"
      logoHomeLink = "/"

# Goldmark

[markup.goldmark.renderer]
unsafe = true


  
# Generic Menu

[menu]

  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "about/"
    weight     = 1

  [[menu.main]]
    identifier = "posts"
    name       = "Blog"
    url        = "posts/"
    weight     = 2

  [[menu.main]]
    identifier = "notes"
    name       = "Notes"
    url        = "notes/"
    weight     = 3

  [[menu.main]]
    identifier = "links"
    name       = "Links"
    url        = "links/"
    weight     = 4

  [[menu.main]]
    identifier = "cv"
    name       = "CV"
    url        = "cv/"
    weight     = 5

  # Resume Menu - uncomment to add resume option to the navbar.
  #[[menu.main]]
   # name = "Resume"
    #url = "/path_to_cv/mycv.pdf"
    #weight = 2.5


  #[[menu.main]]
    #identifier = "writings" 
    #name       = "Academic Writings"
    #url        = "writings/"
	
  [params.portrait]
     path     = "/img/avatar.jpg"
     alt      = "Portrait"
     maxWidth = "155px"

    
  [params.footer]
    trademark = true
    rss = true
    copyright = true
    author = true

    topText = ["A personal blog"]
    bottomText = [
      "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
      "Made by <a href=\"https://github.com/ahmed-aljabri\">Ahmed Al-Jabri</a> &#9812;"
    ]
